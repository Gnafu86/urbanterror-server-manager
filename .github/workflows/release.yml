name: Release

# Builds a Linux AppImage and a Windows .exe and attaches both to a GitHub
# Release. PyInstaller cannot cross-compile, and a PySide6 Windows binary in
# particular has to be produced on Windows, so each artefact is built on its own
# runner and a third job collects them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pytest
          # Qt must be loadable on the build host for PyInstaller to introspect it.
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # No Urban Terror installation on the runner, so the tests that need one
        # skip themselves; the rest still guard the release.
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/utsm.spec

      - name: Assemble the AppDir
        run: |
          APPDIR=build/UrbanTerrorServerManager.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/UrbanTerrorServerManager/. "$APPDIR/usr/bin/"

          cat > "$APPDIR/urbanterror-server-manager.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Urban Terror Server Manager
          Comment=Configure, launch and administer Urban Terror dedicated servers
          Exec=UrbanTerrorServerManager
          Icon=urbanterror-server-manager
          Terminal=false
          Categories=Game;ActionGame;Settings;
          EOF
          cp "$APPDIR/urbanterror-server-manager.desktop" "$APPDIR/usr/share/applications/"

          python packaging/make_icon.py "$APPDIR/urbanterror-server-manager.png"
          cp "$APPDIR/urbanterror-server-manager.png" \
             "$APPDIR/usr/share/icons/hicolor/256x256/apps/"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/UrbanTerrorServerManager" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Build the AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # No FUSE on the runner, so extract the tool and run it directly.
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun \
            build/UrbanTerrorServerManager.AppDir \
            UrbanTerrorServerManager-x86_64.AppImage

      - name: Smoke-test the AppImage
        run: |
          chmod +x UrbanTerrorServerManager-x86_64.AppImage
          rm -rf squashfs-root
          ./UrbanTerrorServerManager-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/UrbanTerrorServerManager

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: UrbanTerrorServerManager-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/utsm.spec

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path dist/UrbanTerrorServerManager.exe)) {
            throw "PyInstaller did not produce the executable"
          }
          Get-Item dist/UrbanTerrorServerManager.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/UrbanTerrorServerManager.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be published
        run: find artifacts -type f -printf '%p  %s bytes\n'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/linux-appimage/UrbanTerrorServerManager-x86_64.AppImage
            artifacts/windows-exe/UrbanTerrorServerManager.exe
          body: |
            ## Downloads

            | Platform | File | How to run |
            |---|---|---|
            | Linux | `UrbanTerrorServerManager-x86_64.AppImage` | `chmod +x` it, then run it |
            | Windows | `UrbanTerrorServerManager.exe` | Run it directly |

            Both bundle their own Python and Qt, so nothing needs installing.

            You still need Urban Terror 4.3 with a dedicated server binary. It is
            found automatically in the usual locations; otherwise you are asked
            for the folder once.

            Windows SmartScreen warns about unsigned executables. That is expected
            for an unsigned build — choose *More info* → *Run anyway*, or build
            from source if you would rather not.
